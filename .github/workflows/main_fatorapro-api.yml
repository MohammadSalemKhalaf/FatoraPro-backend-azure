# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - fatorapro-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: fatoraproregistry.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_B095583F387949CD886B3F7CAB6422E8 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_53CB65A3CBB542559D2B52B0FD883C47 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: fatoraproregistry.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_B095583F387949CD886B3F7CAB6422E8 }}/fatorapro-api:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D2F2CFD586BE4070AEE0B3DAAED96845 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B42DC2206AD74832BD592243574CCA33 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A88175196E734A9AB23AB03B04247ECD }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'fatorapro-api'
          slot-name: 'Production'
          images: 'fatoraproregistry.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_B095583F387949CD886B3F7CAB6422E8 }}/fatorapro-api:${{ github.sha }}'
          